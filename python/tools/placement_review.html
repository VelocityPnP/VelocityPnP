<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placement review</title>
<style>
  :root { color-scheme: dark; font: 16px system-ui, sans-serif; }
  body { margin: 0; background: #101820; color: #edf3f8; }
  header { padding: 1rem 1.5rem; background: #1b2935; }
  h1 { margin: 0 0 .4rem; font-size: 1.5rem; }
  p { margin: .4rem 0; line-height: 1.4; }
  .key { display: inline-block; margin-right: 1rem; font-weight: 650; }
  .target { color: #3fe1ff; }
  .estimate { color: #ffb43b; }
  main { display: grid; grid-template-columns: minmax(11rem, 15rem) minmax(0, 1fr); gap: 1rem; padding: 1rem; }
  nav { max-height: calc(100vh - 12rem); overflow: auto; }
  #placements { display: grid; grid-template-columns: repeat(2, 1fr); gap: .35rem; }
  button { cursor: pointer; font: inherit; color: inherit; background: #253746; border: 1px solid #456070; border-radius: .3rem; padding: .5rem; }
  button:hover, button:focus-visible { border-color: #3fe1ff; }
  button[aria-current="true"] { background: #245778; border-color: #3fe1ff; }
  button.failed { border-left: .3rem solid #ff846d; }
  #viewer { min-width: 0; }
  #toolbar { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: .7rem; }
  #title { margin: 0; font-size: 1.3rem; }
  #details { color: #bdcbd5; margin: .4rem 0 .8rem; }
  .frames { display: grid; grid-template-columns: minmax(0, 1fr) minmax(19rem, .65fr); gap: 1rem; align-items: start; }
  figure { margin: 0; min-width: 0; }
  svg { display: block; width: 100%; height: auto; background: #080d11; border: 1px solid #456070; border-radius: .3rem; }
  figcaption { margin-top: .35rem; color: #bdcbd5; }
  #raw { color: #80dfff; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    nav { max-height: 9rem; }
    #placements { grid-template-columns: repeat(auto-fill, minmax(5rem, 1fr)); }
    .frames { grid-template-columns: 1fr; }
  }
</style>
<header>
  <h1>Placement review</h1>
  <p><span class="key target">◎ Cyan: registered target</span>
     <span class="key estimate">● Amber: estimated part center</span></p>
  <p>Both marks use the saved top-camera result image. The estimate is from
     inspection, not an independent measurement.</p>
</header>
<main>
  <nav aria-label="Placements"><div id="placements"></div></nav>
  <section id="viewer" aria-live="polite">
    <div id="toolbar">
      <button id="previous" type="button">← Previous</button>
      <h2 id="title">Loading…</h2>
      <button id="next" type="button">Next →</button>
    </div>
    <p id="details"></p>
    <div class="frames">
      <figure><svg id="full" role="img" aria-label="Full placement result with target and estimated centers"></svg>
        <figcaption>Full result image</figcaption></figure>
      <figure><svg id="close" role="img" aria-label="Close view with target and estimated centers"></svg>
        <figcaption>Close view around both centers · <a id="raw" target="_blank" rel="noopener">Open original image</a></figcaption></figure>
    </div>
  </section>
</main>
<script>
"use strict";
const svgNS = "http://www.w3.org/2000/svg";
let samples = [];
let selected = 0;

function element(name, attributes) {
  const node = document.createElementNS(svgNS, name);
  for (const [key, value] of Object.entries(attributes)) node.setAttribute(key, String(value));
  return node;
}

function annotate(svg, sample, close) {
  const [tx, ty] = sample.target_px;
  const estimated = sample.estimated_px;
  let box = [0, 0, sample.width, sample.height];
  if (close) {
    const centerX = estimated ? (tx + estimated[0]) / 2 : tx;
    const centerY = estimated ? (ty + estimated[1]) / 2 : ty;
    const spanX = estimated ? Math.max(220, Math.abs(tx - estimated[0]) + 100) : 220;
    const spanY = estimated ? Math.max(160, Math.abs(ty - estimated[1]) + 100) : 160;
    box = [centerX - spanX / 2, centerY - spanY / 2, spanX, spanY];
  }
  svg.setAttribute("viewBox", box.join(" "));
  svg.replaceChildren();
  svg.append(element("image", {href: sample.image, x: 0, y: 0, width: sample.width, height: sample.height}));
  if (estimated) {
    svg.append(element("line", {x1: tx, y1: ty, x2: estimated[0], y2: estimated[1],
      stroke: "#fff", "stroke-width": 2, "stroke-dasharray": "4 4"}));
  }
  svg.append(element("circle", {cx: tx, cy: ty, r: 9, fill: "none",
    stroke: "#05232b", "stroke-width": 5}));
  svg.append(element("circle", {cx: tx, cy: ty, r: 9, fill: "none",
    stroke: "#3fe1ff", "stroke-width": 3}));
  for (const [x1, y1, x2, y2] of [[tx - 15, ty, tx - 11, ty],
                                   [tx + 11, ty, tx + 15, ty],
                                   [tx, ty - 15, tx, ty - 11],
                                   [tx, ty + 11, tx, ty + 15]]) {
    svg.append(element("line", {x1, y1, x2, y2, stroke: "#3fe1ff", "stroke-width": 3}));
  }
  if (estimated) {
    svg.append(element("circle", {cx: estimated[0], cy: estimated[1], r: 6,
      fill: "#ffb43b", stroke: "#301b02", "stroke-width": 2}));
  }
}

function number(value, unit) {
  return typeof value === "number" ? `${value >= 0 ? "+" : ""}${value.toFixed(3)} ${unit}` : "unknown";
}

function show(index) {
  selected = (index + samples.length) % samples.length;
  const sample = samples[selected];
  location.hash = encodeURIComponent(sample.reference);
  document.getElementById("title").textContent = `${selected + 1} / ${samples.length} · ${sample.reference}`;
  document.getElementById("details").textContent =
    `${sample.part_detected ? (sample.inspection_passed ? "Inspection passed" : "Inspection flagged") : "Part not detected"} · ` +
    `X ${number(sample.offset_x_mm, "mm")} · Y ${number(sample.offset_y_mm, "mm")} · ` +
    `rotation ${number(sample.rotation_error_deg, "°")}`;
  document.getElementById("raw").href = sample.image;
  annotate(document.getElementById("full"), sample, false);
  annotate(document.getElementById("close"), sample, true);
  document.querySelectorAll("#placements button").forEach((button, position) => {
    button.setAttribute("aria-current", String(position === selected));
  });
}

async function start() {
  const response = await fetch("manifest.json");
  if (!response.ok) throw new Error(`manifest: HTTP ${response.status}`);
  const manifest = await response.json();
  samples = manifest.samples;
  if (!samples.length) throw new Error("No placement images found");
  const list = document.getElementById("placements");
  samples.forEach((sample, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = sample.reference;
    button.title = sample.part_detected
      ? (sample.inspection_passed ? "Inspection passed" : "Inspection flagged")
      : "Part not detected";
    if (!sample.inspection_passed) button.classList.add("failed");
    button.addEventListener("click", () => show(index));
    list.append(button);
  });
  const requested = decodeURIComponent(location.hash.slice(1));
  const initial = samples.findIndex(sample => sample.reference === requested);
  show(initial < 0 ? 0 : initial);
  document.getElementById("previous").addEventListener("click", () => show(selected - 1));
  document.getElementById("next").addEventListener("click", () => show(selected + 1));
  document.addEventListener("keydown", event => {
    if (event.key === "ArrowLeft") show(selected - 1);
    if (event.key === "ArrowRight") show(selected + 1);
  });
}
start().catch(error => {
  document.getElementById("title").textContent = `Could not load review: ${error.message}`;
});
</script>
</html>
