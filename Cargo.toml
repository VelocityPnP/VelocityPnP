[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/kicad",
    "crates/openpnp",
    "crates/model",
    "crates/planner",
    "crates/vision",
    "crates/driver",
    "crates/store",
    "apps/daemon",
    "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/velocitypnp/velocitypnp"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
futures = "0.3"
http = "1.1"
libc = "0.2"
parking_lot = "0.12"
opencv = { version = "=0.99.1", default-features = false, features = [
    "calib3d",
    "clang-runtime",
    "features2d",
    "imgcodecs",
    "imgproc",
] }
png = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.41", features = ["full"] }
tokio-serial = { version = "5.4", default-features = false }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tract-onnx = { version = "=0.22.0", default-features = false }
uuid = { version = "1.11", features = ["v4", "serde"] }
v4l = { version = "0.14", default-features = false, features = ["v4l2"] }
