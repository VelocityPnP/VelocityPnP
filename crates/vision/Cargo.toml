[package]
name = "velocitypnp-vision"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
native-opencv = ["dep:opencv"]
native-v4l2 = ["dep:v4l"]

[dependencies]
anyhow.workspace = true
opencv = { version = "0.99", optional = true, default-features = false, features = ["calib3d", "imgproc", "videoio"] }
png.workspace = true
serde.workspace = true
v4l = { workspace = true, optional = true }
velocitypnp-domain = { path = "../domain" }

[dev-dependencies]
serde_json.workspace = true
