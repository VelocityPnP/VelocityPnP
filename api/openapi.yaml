          content:
            application/json:
              schema:
                type: object
                required: [executions]
                properties:
                  executions:
                    type: array
                    items: { $ref: "#/components/schemas/JobExecutionRun" }
  /job-executions/{id}:
    get:
      operationId: getJobExecution
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Persistent job execution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobExecutionRun" }
        "404": { $ref: "#/components/responses/NotFound" }
  /job-executions/{id}/pause:
    post:
      operationId: pauseJobExecution
      description: Requests a cooperative pause after the current placement.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated job execution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobExecutionRun" }
  /job-executions/{id}/cancel:
    post:
      operationId: cancelJobExecution
      description: Requests cooperative cancellation without an emergency stop.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated job execution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobExecutionRun" }
  /job-executions/{id}/resume:
    post:
      operationId: resumeJobExecution
      description: Resumes a paused job after a new lease and fine-home check.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, confirmed_external_safety_checks]
              properties:
                lease_id: { type: string, format: uuid }
                confirmed_external_safety_checks: { type: boolean }
      responses:
        "202":
          description: Job execution resume accepted
          content:
            application/json:
              schema:
                type: object
                required: [execution, operation]
                properties:
                  execution: { $ref: "#/components/schemas/JobExecutionRun" }
                  operation: { $ref: "#/components/schemas/Operation" }
  /job-executions/{id}/steps/{step_index}/resolve:
    post:
      operationId: resolveJobExecutionStep
      description: >-
        Records retry or skip recovery. Ordinary retry is rejected after board
        contact. Skip requires an operator note.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: step_index, in: path, required: true, schema: { type: integer, minimum: 0 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [retry, skip] }
                note: { type: [string, "null"] }
      responses:
        "200":
          description: Recovery decision recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobExecutionRun" }
  /jobs/{id}/placement-executions:
    post:
      operationId: startGuardedSinglePlacement
      description: >-
        Executes exactly one plan step through the calibrated motion planner.
        Physical use requires current fine homing, feeder qualification,
        board registration, and a measured board surface.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lease_id
                - calibration_id
                - confirmed_external_safety_checks
              properties:
                lease_id: { type: string, format: uuid }
                calibration_id: { type: string, format: uuid }
                step_index: { type: integer, minimum: 0, default: 0 }
                confirmed_external_safety_checks: { type: boolean }
      responses:
        "202":
          description: Guarded single placement accepted
          content:
            application/json:
              schema:
                type: object
                required: [execution, operation]
                properties:
                  execution: { $ref: "#/components/schemas/PlacementExecutionRun" }
                  operation: { $ref: "#/components/schemas/Operation" }
  /placement-executions/{id}:
    get:
      operationId: getPlacementExecution
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Persistent guarded single-placement execution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacementExecutionRun" }
        "404": { $ref: "#/components/responses/NotFound" }
  /placement-executions/{id}/reanalyze-placement:
    post:
      operationId: reanalyzePlacementExecution
      description: Reanalyzes retained placement images without machine motion.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated placement execution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacementExecutionRun" }
  /placement-executions/{id}/outcome:
    get:
      operationId: getPlacementOutcome
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Automatic and operator-reviewed placement outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacementOutcomeRecord" }
    post:
      operationId: reviewPlacementOutcome
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disposition]
              properties:
                disposition: { $ref: "#/components/schemas/PlacementOutcomeDisposition" }
                note: { type: [string, "null"], maxLength: 500 }
      responses:
        "200":
          description: Reviewed placement outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacementOutcomeRecord" }
  /placement-outcomes:
    get:
      operationId: listPlacementOutcomes
      responses:
        "200":
          description: Persistent placement outcomes
          content:
            application/json:
              schema:
                type: object
                required: [outcomes]
                properties:
                  outcomes:
                    type: array
                    items: { $ref: "#/components/schemas/PlacementOutcomeRecord" }
  /parts/{id}/placement-process/{nozzle_id}/surfaces/{surface_offset_mm}:
    get:
      operationId: getPartPlacementProcess
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: nozzle_id, in: path, required: true, schema: { type: string } }
        - { name: surface_offset_mm, in: path, required: true, schema: { type: number, minimum: 0, maximum: 10 } }
      responses:
        "200":
          description: Bounded seating-offset estimate from retained outcomes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlacementProcessEstimate" }
  /inspections:
    get:
      operationId: listInspections
      responses:
        "200": { description: Inspection reports, content: { application/json: { schema: { type: object } } } }
    post:
      operationId: putInspection
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InspectionReport" } } } }
      responses:
        "201": { description: Stored inspection report, content: { application/json: { schema: { $ref: "#/components/schemas/InspectionReport" } } } }
  /inspections/{id}:
    get:
      operationId: getInspection
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Inspection report, content: { application/json: { schema: { $ref: "#/components/schemas/InspectionReport" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /inspections/{id}/findings/{finding_id}/disposition:
    post:
      operationId: dispositionInspectionFinding
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: finding_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disposition]
              properties:
                disposition: { type: string, enum: [accepted, rework, false_positive] }
      responses:
        "200": { description: Updated inspection report, content: { application/json: { schema: { $ref: "#/components/schemas/InspectionReport" } } } }
components:
  responses:
    OperationAccepted:
      description: Operation accepted
      content: { application/json: { schema: { $ref: "#/components/schemas/Operation" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    PartOrientation:
      oneOf:
        - type: object
          required: [mode]
          properties:
            mode: { type: string, const: axis_symmetric }
        - type: object
          required: [mode]
          properties:
            mode: { type: string, const: feeder_referenced }
        - type: object
          required: [mode, minimum_contrast_luma, rotation_offset_deg]
          properties:
            mode: { type: string, const: brighter_end }
            minimum_contrast_luma: { type: number, minimum: 2, maximum: 64 }
            rotation_offset_deg: { type: number, minimum: -360, maximum: 360 }
        - type: object
          required: [mode, minimum_contrast_luma, rotation_offset_deg]
          properties:
            mode: { type: string, const: darker_end }
            minimum_contrast_luma: { type: number, minimum: 2, maximum: 64 }
            rotation_offset_deg: { type: number, minimum: -360, maximum: 360 }
    PlacementReleaseSchedule:
      type: object
      required:
        - start_seating_offset_mm
        - minimum_seating_offset_mm
        - step_mm
      properties:
        start_seating_offset_mm: { type: number, minimum: -0.5, maximum: 0.5 }
        minimum_seating_offset_mm: { type: number, minimum: -0.5, maximum: 0.5 }
        step_mm: { type: number, minimum: 0.02, maximum: 0.25 }
    Part:
      type: object
      required:
        - id
        - key
        - manufacturer_part_number
        - package
        - height_mm
        - body_width_mm
        - body_length_mm
        - placement_seating_offset_mm
        - placement_release
        - compatible_tips
        - vision_profile
        - orientation
      properties:
        id: { type: string, format: uuid }
        key: { type: string, minLength: 1 }
        manufacturer_part_number: { type: [string, "null"] }
        package: { type: string, minLength: 1 }
        height_mm: { type: [number, "null"], exclusiveMinimum: 0 }
        body_width_mm: { type: [number, "null"], exclusiveMinimum: 0 }
        body_length_mm: { type: [number, "null"], exclusiveMinimum: 0 }
        placement_seating_offset_mm: { type: [number, "null"], minimum: -0.25, maximum: 0.5 }
        placement_release:
          oneOf:
            - { $ref: "#/components/schemas/PlacementReleaseSchedule" }
            - type: "null"
        compatible_tips: { type: array, items: { type: string } }
        vision_profile: { type: [string, "null"] }
        orientation:
          oneOf:
            - { $ref: "#/components/schemas/PartOrientation" }
            - type: "null"
    PlacementPlanStep:
      type: object
      required:
        - board_instance_id
        - placement_reference
        - part_key
        - feeder_id
        - nozzle_id
        - part_height_mm
        - body_width_mm
        - body_length_mm
        - part_orientation
        - feeder_part_rotation_deg
        - placement_surface_offset_mm
        - placement_seating_offset_mm
        - placement_release_seating_offsets_mm
        - feeder_pick
        - board_place
        - safe_z_mm
      properties:
        board_instance_id: { type: string, format: uuid }
        placement_reference: { type: string }
        part_key: { type: string }
        feeder_id: { type: string, format: uuid }
        nozzle_id: { type: string }
        part_height_mm: { type: number, exclusiveMinimum: 0 }
        body_width_mm: { type: number, exclusiveMinimum: 0 }
        body_length_mm: { type: number, exclusiveMinimum: 0 }
        part_orientation: { $ref: "#/components/schemas/PartOrientation" }
        feeder_part_rotation_deg: { type: number }
        placement_surface_offset_mm: { type: number }
        placement_seating_offset_mm: { type: number }
        placement_release_seating_offsets_mm:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: number, minimum: -0.5, maximum: 0.5 }
        feeder_pick: { $ref: "#/components/schemas/Pose" }
        board_place: { $ref: "#/components/schemas/Pose" }
        safe_z_mm: { type: number }
    PlacementPlan:
      type: object
      required: [job_id, steps, report]
      properties:
        job_id: { type: string, format: uuid }
        steps:
          type: array
          items: { $ref: "#/components/schemas/PlacementPlanStep" }
        report:
          type: object
          required: [ready, errors, warnings, placement_count]
          properties:
            ready: { type: boolean }
            errors: { type: array, items: { type: string } }
            warnings: { type: array, items: { type: string } }
            placement_count: { type: integer, minimum: 0 }
    CameraRole:
      type: string
      enum: [top_camera, bottom_camera]
    CameraProfile:
      type: object
      required:
        - machine_profile_id
        - role
        - width
        - height
        - frames_per_second
        - settle_frames
        - controls
        - lighting_enabled
        - thresholds
      properties:
        machine_profile_id: { type: string, minLength: 1 }
        role: { $ref: "#/components/schemas/CameraRole" }
        width: { type: integer, minimum: 2 }
        height: { type: integer, minimum: 1 }
        frames_per_second: { type: integer, minimum: 1 }
        settle_frames: { type: integer, minimum: 0, maximum: 120 }
        controls:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            required: [id, value]
            properties:
              id: { type: integer, minimum: 0 }
              value: { oneOf: [{ type: integer }, { type: boolean }] }
        lighting_enabled: { type: boolean }
        thresholds:
          type: object
          required:
            - max_relative_luma_range
            - max_relative_focus_range
            - min_target_detection_rate
            - max_center_jitter_px
          properties:
            max_relative_luma_range: { type: number, minimum: 0 }
            max_relative_focus_range: { type: number, minimum: 0 }
            min_target_detection_rate: { type: number, minimum: 0, maximum: 1 }
            max_center_jitter_px: { type: number, minimum: 0 }
    CameraReproducibilityReport:
      type: object
      required:
        - requested_samples
        - captured_samples
        - capture_failures
        - mean_luma
        - relative_luma_range
        - mean_laplacian_variance
        - relative_focus_range
        - target_detection_rate
        - passed
        - samples
      properties:
        requested_samples: { type: integer, minimum: 1 }
        captured_samples: { type: integer, minimum: 0 }
        capture_failures: { type: integer, minimum: 0 }
        mean_luma: { type: number }
        relative_luma_range: { type: number, minimum: 0 }
        mean_laplacian_variance: { type: number, minimum: 0 }
        relative_focus_range: { type: number, minimum: 0 }
        target_detection_rate: { type: number, minimum: 0, maximum: 1 }
        mean_target_x_px: { type: [number, "null"] }
        mean_target_y_px: { type: [number, "null"] }
        center_jitter_p95_px: { type: [number, "null"], minimum: 0 }
        passed: { type: boolean }
        samples: { type: array, items: { type: object } }
    SensorReading:
      type: object
      required: [sensor_id, raw_value, unit, observed_at]
      properties:
        sensor_id: { type: string }
        raw_value:
          type: integer
          description: Signed raw controller count; not calibrated pressure.
        unit: { type: string, const: raw_counts }
        observed_at: { type: string, format: date-time }
    VisualHomingPlan:
      type: object
      required:
        - target
        - error_x_px
        - error_y_px
        - error_radius_px
        - correction_x_mm
        - correction_y_mm
        - correction_distance_mm
        - within_capture_bound
        - within_correction_bound
        - accepted
      properties:
        target: { type: object }
        error_x_px: { type: number }
        error_y_px: { type: number }
        error_radius_px: { type: number, minimum: 0 }
        correction_x_mm: { type: number }
        correction_y_mm: { type: number }
        correction_distance_mm: { type: number, minimum: 0 }
        within_capture_bound: { type: boolean }
        within_correction_bound: { type: boolean }
        accepted: { type: boolean }
    VisualHomingResult:
      type: object
      required: [applied, seed_pose, initial]
      properties:
        applied: { type: boolean }
        seed_pose: { $ref: "#/components/schemas/Pose" }
        initial: { $ref: "#/components/schemas/VisualHomingPlan" }
        corrected_pose: { $ref: "#/components/schemas/Pose" }
        verification: { $ref: "#/components/schemas/VisualHomingPlan" }
        final_pose: { $ref: "#/components/schemas/Pose" }
    Confirmation:
      type: object
      required: [confirmed]
      properties: { confirmed: { type: boolean } }
    LeaseRequest:
      type: object
      required: [lease_id]
      properties: { lease_id: { type: string, format: uuid } }
    Pose:
      type: object
      required: [x_mm, y_mm, z_mm, rotation_deg]
      properties:
        x_mm: { type: number }
        y_mm: { type: number }
        z_mm: { type: number }
        rotation_deg: { type: number }
    JogTarget:
      type: object
      required: [x_mm, y_mm, z_mm]
      properties:
        x_mm: { type: number }
        y_mm: { type: number }
        z_mm: { type: number }
        rotation_deg:
          type: number
          description: Omit to preserve the controller-reported primary-nozzle angle.
    Residuals:
      type: object
      required: [sample_count, rms_mm, p95_mm, max_mm]
      properties:
        sample_count: { type: integer, minimum: 1 }
        rms_mm: { type: number, minimum: 0 }
        p95_mm: { type: number, minimum: 0 }
        max_mm: { type: number, minimum: 0 }
    WorkspaceScanRegion:
      type: object
      required: [x_min_mm, x_max_mm, y_min_mm, y_max_mm]
      properties:
        x_min_mm: { type: number }
        x_max_mm: { type: number }
        y_min_mm: { type: number }
        y_max_mm: { type: number }
    WorkspaceScanSpecification:
      type: object
      required: [calibration_id]
      anyOf:
        - required: [region]
        - required: [region_preset]
        - required: [parent_scan_id, refinement_target_index]
      description: >-
        A region can accompany installed_plates to request a cropped plate-plane
        scan. Refinement mode instead selects one current-policy target from a
        successful reconnaissance parent. The service intersects either source
        with reachable installed-plate coverage.
      properties:
        calibration_id: { type: string, format: uuid }
        mode:
          type: string
          enum: [precision, survey, reconnaissance, refinement]
          default: precision
          description: >-
            reconnaissance requires installed_plates and makes one coarse
            plate-plane mosaic with timestamp-gated persistent capture.
            refinement selects a parent target and defaults to a layered,
            transient-source scan.
        artifact_retention:
          type: string
          enum: [full_sources, transient_sources, thumbnails, mosaic_only]
          description: >-
            transient_sources is available for layered surveys. It stores
            captures temporarily, reconstructs final height products in
            chunks, and deletes the source frames.
        region: { $ref: "#/components/schemas/WorkspaceScanRegion" }
        region_preset:
          type: string
          enum: [installed_plates]
        parent_scan_id:
          type: string
          format: uuid
          description: Successful reconnaissance parent for refinement mode.
        refinement_target_index:
          type: integer
          minimum: 0
          description: Index in the parent's current refinement-target list.
        overlap_fraction:
          type: number
          minimum: 0.1
          maximum: 0.75
          description: >-
            Reconnaissance mode defaults to 0.10. Other modes require at least
            0.20. Survey mode defaults to 0.30. Refinement and installed-plate
            layered scans use at least 0.60 for reliable reconstruction.
        output_mm_per_pixel: { type: number, exclusiveMinimum: 0 }
        feed_mm_per_min:
          type: number
          exclusiveMinimum: 0
          description: >-
            Optional XY feed. It cannot exceed the active machine profile's
            validated default feed.
        max_tiles: { type: integer, minimum: 1, maximum: 12000 }
        artifact_quota_bytes:
          type: integer
          minimum: 1
          maximum: 536870912
    StartWorkspaceScanRequest:
      allOf:
        - $ref: "#/components/schemas/WorkspaceScanSpecification"
        - type: object
          required: [lease_id, confirmed_external_safety_checks]
          properties:
            lease_id: { type: string, format: uuid }
            confirmed_external_safety_checks: { type: boolean }
    WorkspaceScanEstimate:
      type: object
      required:
        - mode
        - artifact_retention
        - surface_model
        - surface_models
        - region
        - raster_transform
        - overlap_fraction
        - output_mm_per_pixel
        - feed_mm_per_min
        - capture_settle_frames
        - rows
        - columns
        - planned_tiles
        - planned_registrations
        - mosaic_width_px
        - mosaic_height_px
        - estimated_duration_seconds
        - estimated_retained_bytes
        - artifact_quota_bytes
        - persistent_capture
        - warnings
      properties:
        mode: { type: string, enum: [precision, survey, reconnaissance, refinement] }
        artifact_retention:
          type: string
          enum: [full_sources, transient_sources, thumbnails, mosaic_only]
        surface_model:
          type: string
          enum: [top_camera_working_plane, installed_plate_planes]
        surface_models:
          type: array
          minItems: 1
          items:
            type: string
            enum: [top_camera_working_plane, installed_plate_planes]
          description: >-
            Mosaics that the scan will reconstruct from the same captures.
            Installed-plate surveys include both calibrated height layers.
        region: { $ref: "#/components/schemas/WorkspaceScanRegion" }
        raster_transform: { $ref: "#/components/schemas/WorkspaceRasterTransform" }
        overlap_fraction: { type: number }
        output_mm_per_pixel: { type: number, exclusiveMinimum: 0 }
        feed_mm_per_min: { type: number, exclusiveMinimum: 0 }
        capture_settle_frames: { type: integer, minimum: 0 }
        rows: { type: integer, minimum: 1 }
        columns: { type: integer, minimum: 1 }
        planned_tiles: { type: integer, minimum: 1 }
        planned_registrations: { type: integer, minimum: 0 }
        mosaic_width_px: { type: integer, minimum: 2 }
        mosaic_height_px: { type: integer, minimum: 2 }
        estimated_duration_seconds: { type: integer, minimum: 0 }
        estimated_retained_bytes: { type: integer, minimum: 0 }
        artifact_quota_bytes: { type: integer, minimum: 1 }
        persistent_capture: { type: boolean }
        warnings:
          type: array
          items: { type: string }
          description: >-
            Preflight notices, including installed plate edges that are outside
            reachable top-camera coverage.
    WorkspaceScanReport:
      type: object
      required:
        - id
        - operation_id
        - calibration_id
        - profile_id
        - created_at
        - updated_at
        - status
        - mode
        - artifact_retention
        - surface_model
        - region
        - feed_mm_per_min
        - capture_settle_frames
        - discarded_capture_frames
        - timestamp_fresh_frames
        - planned_tiles
        - captured_tiles
        - estimated_duration_seconds
        - estimated_retained_bytes
        - artifact_quota_bytes
        - retained_artifact_bytes
        - persistent_capture
        - tiles
        - registrations
        - warnings
      properties:
        id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        calibration_id: { type: string, format: uuid }
        profile_id: { type: string }
        parent_scan_id: { type: [string, "null"], format: uuid }
        refinement_target_index: { type: [integer, "null"], minimum: 0 }
        refinement_algorithm_version: { type: [string, "null"] }
        refinement_batch_operation_id: { type: [string, "null"], format: uuid }
        refinement_priority: { type: [integer, "null"], minimum: 1 }
        refinement_severity_score: { type: [number, "null"], minimum: 0 }
        refinement_priority_algorithm_version: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        status:
          type: string
          enum: [pending, running, succeeded, failed]
        mode: { type: string, enum: [precision, survey, reconnaissance, refinement] }
        artifact_retention:
          type: string
          enum: [full_sources, transient_sources, thumbnails, mosaic_only]
        surface_model:
          type: string
          enum: [top_camera_working_plane, installed_plate_planes]
        region: { $ref: "#/components/schemas/WorkspaceScanRegion" }
        raster_transform:
          oneOf:
            - $ref: "#/components/schemas/WorkspaceRasterTransform"
            - type: "null"
        feed_mm_per_min: { type: number, minimum: 0 }
        capture_settle_frames: { type: integer, minimum: 0 }
        discarded_capture_frames: { type: integer, minimum: 0 }
        timestamp_fresh_frames: { type: integer, minimum: 0 }
        planned_tiles: { type: integer, minimum: 1 }
        captured_tiles: { type: integer, minimum: 0 }
        mosaic_width_px: { type: [integer, "null"], minimum: 2 }
        mosaic_height_px: { type: [integer, "null"], minimum: 2 }
        covered_fraction: { type: [number, "null"], minimum: 0, maximum: 1 }
        nominal_fallback_fraction: { type: number, minimum: 0, maximum: 1 }
        estimated_duration_seconds: { type: integer, minimum: 0 }
        estimated_retained_bytes: { type: integer, minimum: 0 }
        artifact_quota_bytes: { type: integer, minimum: 1 }
        retained_artifact_bytes: { type: integer, minimum: 0 }
        persistent_capture: { type: boolean }
        accepted_registrations: { type: integer, minimum: 0 }
        attempted_registrations: { type: integer, minimum: 0 }
        tiles: { type: array, items: { type: object } }
        registrations: { type: array, items: { type: object } }
        mosaic_artifact_name: { type: [string, "null"] }
        mosaic_layers:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceMosaicLayerReport" }
        parallax:
          oneOf:
            - $ref: "#/components/schemas/WorkspaceParallaxSummary"
            - type: "null"
        height_map:
          oneOf:
            - $ref: "#/components/schemas/WorkspaceHeightMapSummary"
            - type: "null"
        seam_health:
          oneOf:
            - $ref: "#/components/schemas/WorkspaceSeamHealthSummary"
            - type: "null"
        refinement_composite:
          oneOf:
            - $ref: "#/components/schemas/WorkspaceRefinementCompositeSummary"
            - type: "null"
        board_discovery:
          oneOf:
            - $ref: "#/components/schemas/WorkspaceBoardDiscoverySummary"
            - type: "null"
        strip_feeder_inventory:
          oneOf:
            - $ref: "#/components/schemas/StripFeederInventorySummary"
            - type: "null"
        change_set:
          oneOf:
            - $ref: "#/components/schemas/WorkspaceChangeSetSummary"
            - type: "null"
        warnings: { type: array, items: { type: string } }
        failure: { type: [string, "null"] }
    WorkspaceRefinementTargets:
      type: object
      required:
        - parent_scan_id
        - algorithm_version
        - source_algorithm_version
        - source_recommended_action
        - recommended_action
        - priority_algorithm_version
        - target_regions
        - targets
        - remaining_targets
      properties:
        parent_scan_id: { type: string, format: uuid }
        algorithm_version: { type: string }
        source_algorithm_version: { type: string }
        source_recommended_action:
          type: string
          enum: [accept, targeted_refinement, review_geometry, increase_overlap]
        recommended_action:
          type: string
          enum: [accept, targeted_refinement, review_geometry, increase_overlap]
        priority_algorithm_version: { type: string }
        target_regions:
          type: array
          items: { $ref: "#/components/schemas/WorkspaceScanRegion" }
        targets:
          type: array
          description: Severity-ranked targets. Priority 1 runs first.
          items: { $ref: "#/components/schemas/WorkspaceRefinementTarget" }
        remaining_targets: { type: integer, minimum: 0 }
    WorkspaceRefinementTarget:
      type: object
      required:
        - target_index
        - priority
        - region
        - severity_score
        - elevated_seams
        - unresolved_seams
        - maximum_disagreement_p95_luma
        - maximum_correction_mm
        - reason
        - completed_scan_id
        - latest_scan_id
        - latest_scan_status
