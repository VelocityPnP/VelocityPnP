  /jobs/{id}/simulate:
    post:
      operationId: simulateJob
      description: >-
        Executes conservative placement cycles only with the simulator driver.
        Supplying a calibration snapshot routes every logical move through the
        calibrated motion planner. Omitting it deliberately uses raw controller
        coordinates.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id]
              properties:
                lease_id: { type: string, format: uuid }
                calibration_id:
                  type: string
                  format: uuid
                  description: Current snapshot whose validated motion corrections are applied.
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /jobs/{id}/executions:
    post:
      operationId: startJobExecution
      description: >-
        Starts a persistent multi-placement job. Physical execution requires
        current fine XYZ homing. The runner stops between placements for pause
        or cancel and stops after each failed placement for operator recovery.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lease_id
                - calibration_id
                - confirmed_external_safety_checks
              properties:
                lease_id: { type: string, format: uuid }
                calibration_id: { type: string, format: uuid }
                confirmed_external_safety_checks: { type: boolean }
      responses:
        "202":
          description: Persistent job execution accepted
          content:
            application/json:
              schema:
                type: object
                required: [execution, operation]
                properties:
                  execution: { $ref: "#/components/schemas/JobExecutionRun" }
                  operation: { $ref: "#/components/schemas/Operation" }
  /job-executions:
    get:
      operationId: listJobExecutions
