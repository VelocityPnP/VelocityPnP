    PlacementProcessEstimate:
      type: object
      required:
        - part_id
        - part_key
        - package
        - nozzle_id
        - placement_surface_offset_mm
        - current_seating_offset_mm
        - observation_count
        - operator_review_count
        - offset_summaries
        - recommended_seating_offset_mm
        - recommendation_confidence
        - ready
        - findings
      properties:
        part_id: { type: string, format: uuid }
        part_key: { type: string }
        package: { type: string }
        nozzle_id: { type: string }
        placement_surface_offset_mm: { type: number, format: double }
        current_seating_offset_mm: { type: [number, "null"], format: double }
        observation_count: { type: integer, minimum: 0 }
        operator_review_count: { type: integer, minimum: 0 }
        offset_summaries:
          type: array
          items: { $ref: "#/components/schemas/PlacementOffsetSummary" }
        recommended_seating_offset_mm: { type: [number, "null"], format: double }
        recommendation_confidence: { type: number, minimum: 0, maximum: 1 }
        ready: { type: boolean }
        findings: { type: array, items: { type: string } }
    Point2d:
      type: array
      minItems: 2
      maxItems: 2
      items: { type: number }
    WorkspaceBoardDesignMatch:
      type: object
      required:
        - board_id
        - board_name
        - rotation_deg
        - dimension_error_mm
        - dimension_error_fraction
        - confidence
      properties:
        board_id: { type: string, format: uuid }
        board_name: { type: string }
        rotation_deg: { type: number }
        dimension_error_mm: { type: number, minimum: 0 }
        dimension_error_fraction: { type: number, minimum: 0 }
        confidence: { type: number, minimum: 0, maximum: 1 }
    WorkspaceRefinementPatchQuality:
      type: object
      required:
        - target_index
        - scan_id
        - artifact_name
        - composed
        - accepted
        - covered_fraction
        - photometric_offset_luma
        - boundary_disagreement_p95_luma
        - parent_texture_energy
        - refinement_texture_energy
        - texture_retention_ratio
        - internal_seam_discontinuity_ratio
        - findings
        - observations
      properties:
        target_index: { type: integer, minimum: 0 }
        scan_id: { type: string, format: uuid }
        artifact_name: { type: string }
        composed: { type: boolean }
        accepted: { type: boolean }
        covered_fraction: { type: number, minimum: 0, maximum: 1 }
        photometric_offset_luma: { type: number }
        boundary_disagreement_p95_luma: { type: number, minimum: 0 }
        parent_texture_energy: { type: number, minimum: 0 }
        refinement_texture_energy: { type: number, minimum: 0 }
        texture_retention_ratio: { type: [number, "null"], minimum: 0 }
        internal_seam_discontinuity_ratio:
          type: [number, "null"]
          minimum: 0
        findings:
          type: array
          items: { type: string }
        observations:
          type: array
          items: { type: string }
    WorkspaceRefinementQualityThresholds:
      type: object
      required:
        - minimum_coverage_fraction
        - minimum_texture_retention_ratio
        - boundary_review_p95_luma
        - seam_discontinuity_review_ratio
      properties:
        minimum_coverage_fraction: { type: number, minimum: 0, maximum: 1 }
        minimum_texture_retention_ratio: { type: number, minimum: 0 }
        boundary_review_p95_luma: { type: number, minimum: 0 }
        seam_discontinuity_review_ratio: { type: number, minimum: 0 }
    WorkspaceMosaicLayerReport:
      type: object
      required:
        - surface_model
        - artifact_name
        - covered_fraction
        - nominal_fallback_fraction
        - accepted_registrations
        - attempted_registrations
        - applied_corrections
      properties:
        surface_model:
          type: string
          enum: [top_camera_working_plane, installed_plate_planes]
        artifact_name: { type: string }
        covered_fraction: { type: number, minimum: 0, maximum: 1 }
        nominal_fallback_fraction: { type: number, minimum: 0, maximum: 1 }
        accepted_registrations: { type: integer, minimum: 0 }
        attempted_registrations: { type: integer, minimum: 0 }
        applied_corrections: { type: integer, minimum: 0 }
    WorkspaceParallaxSummary:
      type: object
      required:
        - artifact_name
        - working_plane_fraction
        - installed_plate_fraction
        - attempted_pairs
        - pairs_with_overlap
        - descriptor_matches
        - accepted_observations
      description: >-
        Sparse local surface-height evidence from camera parallax. Fraction
        zero is the calibrated working plane; fraction one is the installed
        bare-plate plane. Negative values are above the working plane.
      properties:
        artifact_name: { type: string }
        working_plane_fraction: { type: number }
        installed_plate_fraction: { type: number }
        attempted_pairs: { type: integer, minimum: 0 }
        pairs_with_overlap: { type: integer, minimum: 0 }
        descriptor_matches: { type: integer, minimum: 0 }
        accepted_observations: { type: integer, minimum: 0 }
    WorkspaceSeamHealthSummary:
      type: object
      required:
        - report_artifact_name
        - disagreement_artifact_name
        - overlap_confidence_artifact_name
        - overlay_artifact_name
        - preview_artifact_name
        - total_seams
        - healthy_seams
        - elevated_seams
        - unresolved_seams
        - target_regions
        - overlap_pixel_fraction
        - disagreement_p50_luma
        - disagreement_p95_luma
        - recommended_action
      description: >-
        Diagnostic-only overlap health for a reconnaissance mosaic. It does
        not change tile placement. The action selects acceptance, a local
        refinement scan, a geometry review, or more overlap.
      properties:
        report_artifact_name: { type: string }
        disagreement_artifact_name: { type: string }
        overlap_confidence_artifact_name: { type: string }
        overlay_artifact_name: { type: string }
        preview_artifact_name: { type: string }
        total_seams: { type: integer, minimum: 0 }
        healthy_seams: { type: integer, minimum: 0 }
        elevated_seams: { type: integer, minimum: 0 }
        unresolved_seams: { type: integer, minimum: 0 }
        target_regions: { type: integer, minimum: 0 }
        overlap_pixel_fraction: { type: number, minimum: 0, maximum: 1 }
        disagreement_p50_luma: { type: number, minimum: 0 }
        disagreement_p95_luma: { type: number, minimum: 0 }
        recommended_action:
          type: string
          enum: [accept, targeted_refinement, review_geometry, increase_overlap]
    WorkspaceHeightMapSummary:
      type: object
      required:
        - map_artifact_name
        - preview_artifact_name
        - confidence_artifact_name
        - corrected_mosaic_artifact_name
        - cell_size_mm
        - rows
        - columns
        - measured_cells
        - inferred_cells
        - unknown_cells
        - candidate_fractions
      description: >-
        Confidence-aware surface map made from sparse parallax observations.
        Surface fractions use the same relative scale as the parallax report.
        Unknown cells stay unknown. Their corrected-mosaic pixels use the
        endpoint projection with lower local source-image disagreement.
      properties:
        map_artifact_name: { type: string }
        preview_artifact_name: { type: string }
        confidence_artifact_name: { type: string }
        corrected_mosaic_artifact_name: { type: string }
        class_overlay_artifact_name:
          type: string
          description: >-
            Transparent PNG height-class overlay. Bare installed-plate and
            unknown pixels have zero alpha. Measured non-plate pixels use
            higher alpha than locally inferred pixels.
        class_preview_artifact_name:
          type: string
          description: >-
            Corrected mosaic with the transparent height-class overlay
            composited onto it for inspection.
        cell_size_mm: { type: number, exclusiveMinimum: 0 }
        rows: { type: integer, minimum: 1 }
        columns: { type: integer, minimum: 1 }
        measured_cells: { type: integer, minimum: 0 }
        inferred_cells: { type: integer, minimum: 0 }
        unknown_cells: { type: integer, minimum: 0 }
        candidate_fractions:
          type: array
          items: { type: number }
        camera_aperture:
          oneOf:
            - $ref: "#/components/schemas/WorkspaceCameraApertureSummary"
            - type: "null"
    WorkspaceCameraApertureSummary:
      type: object
      required:
        - center_x_mm
        - center_y_mm
        - radius_mm
        - projection_mm_per_pixel
        - projection_residual_p95_mm
        - projection_fitted_from_detections
        - source_tile_index
        - source_tile_indices
        - source_center_error_px
        - supporting_detections
      description: >-
        Automatically detected non-planar bottom-camera aperture. Repeated
        detections fit the camera depth and align all agreeing views to one
        machine-space center. A center-weighted blend and narrow guard band
        replace the aperture and its reconstruction artifacts. The surrounding
        plate and light ring keep normal reconstruction.
      properties:
        center_x_mm: { type: number }
        center_y_mm: { type: number }
        radius_mm: { type: number, exclusiveMinimum: 0 }
        projection_mm_per_pixel: { type: number, exclusiveMinimum: 0 }
        projection_residual_p95_mm:
          type: [number, "null"]
          minimum: 0
        projection_fitted_from_detections: { type: boolean }
        source_tile_index: { type: integer, minimum: 0 }
        source_tile_indices:
          type: array
          items: { type: integer, minimum: 0 }
        source_center_error_px: { type: number, minimum: 0 }
        supporting_detections: { type: integer, minimum: 3 }
    WorkspaceRasterTransform:
      type: object
      required:
        - top_left_x_mm
        - top_left_y_mm
        - x_mm_per_pixel
        - y_mm_per_pixel
      description: >-
        Maps mosaic pixel coordinates to machine XY. Pixel (0, 0) is at the
        upper left. Pixel X points toward positive machine X. Pixel Y points
        toward negative machine Y.
      properties:
        top_left_x_mm: { type: number }
        top_left_y_mm: { type: number }
        x_mm_per_pixel: { type: number, exclusiveMinimum: 0 }
        y_mm_per_pixel: { type: number, exclusiveMaximum: 0 }
    MachineStatus:
      type: object
      required: [state, simulated, profile_id, homed]
      properties:
        state:
          type: string
          enum: [disconnected, connected, preflight, unhomed, homing, ready, running, paused, fault, e_stopped]
        simulated: { type: boolean }
        profile_id: { type: string }
        pose: { oneOf: [{ $ref: "#/components/schemas/Pose" }, { type: "null" }] }
        homed: { type: boolean }
        fault: { type: [object, "null"] }
        control_lease: { type: [object, "null"] }
        calibration_revision: { type: [string, "null"], format: uuid }
    DeviceIdentity:
      type: object
      required: [kind, path]
      properties:
        kind: { type: string, enum: [serial_controller, camera] }
        path: { type: string }
        stable_path: { type: [string, "null"] }
        vendor_id: { type: [string, "null"] }
        product_id: { type: [string, "null"] }
        serial: { type: [string, "null"] }
        product: { type: [string, "null"] }
        capture_capable: { type: [boolean, "null"] }
        suggested_role: { type: [string, "null"] }
    CalibrationCheck:
      type: object
      required: [id, title, source, status, message, evidence]
      properties:
        id: { type: string }
        title: { type: string }
        source: { type: string, enum: [controller, vision, operator] }
        status: { type: string, enum: [pending, passed, failed] }
        message: { type: string }
        evidence: {}
    VisualHomingValidationSample:
      type: object
      required:
        - cycle
        - observed_at
        - initial_correction_mm
        - correction_count
        - verification_residual_mm
        - verification_residual_px
        - return_residual_mm
        - return_residual_px
        - return_error_x_px
        - return_error_y_px
      properties:
        cycle: { type: integer, minimum: 1 }
        observed_at: { type: string, format: date-time }
        initial_correction_mm: { type: number, minimum: 0 }
        correction_count: { type: integer, minimum: 0 }
        return_refinement_count:
          type: integer
          minimum: 0
          default: 0
          description: Bounded visual refinements after a direction-dependent return error.
        verification_residual_mm: { type: number, minimum: 0 }
        verification_residual_px: { type: number, minimum: 0 }
        return_residual_mm: { type: number, minimum: 0 }
        return_residual_px: { type: number, minimum: 0 }
        return_error_x_px: { type: number }
        return_error_y_px: { type: number }
    VisualHomingValidationReport:
      type: object
      required:
        - visual_verification
        - independent_return
        - initial_correction_min_mm
        - initial_correction_mean_mm
        - initial_correction_max_mm
        - passed
      properties:
        visual_verification: { $ref: "#/components/schemas/Residuals" }
        independent_return: { $ref: "#/components/schemas/Residuals" }
        initial_correction_min_mm: { type: number, minimum: 0 }
        initial_correction_mean_mm: { type: number, minimum: 0 }
        initial_correction_max_mm: { type: number, minimum: 0 }
        passed: { type: boolean }
    AutomatedCalibrationRun:
      type: object
      required:
        - id
        - calibration_id
        - operation_id
        - profile_id
        - created_at
        - updated_at
        - status
        - phase
        - config
        - checks
        - camera_reports
        - visual_homing_samples
        - simulated
      properties:
        id: { type: string, format: uuid }
        calibration_id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        profile_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, running, succeeded, rejected, failed] }
        phase:
          type: string
          enum: [pending, coarse_homing, actuator_checks, top_camera_reproducibility, tooling_verification, bottom_camera_reproducibility, visual_homing_validation, head_geometry_calibration, top_camera_planar_calibration, bottom_camera_planar_calibration, installed_plate_geometry, complete]
        config: { type: object }
        checks:
          type: array
          items: { $ref: "#/components/schemas/CalibrationCheck" }
        camera_reports: { type: object, additionalProperties: true }
        visual_homing_samples:
          type: array
          items: { $ref: "#/components/schemas/VisualHomingValidationSample" }
        visual_homing_report:
          oneOf:
            - { $ref: "#/components/schemas/VisualHomingValidationReport" }
            - { type: "null" }
        head_geometry_report:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        installed_geometry_report:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        failure: { type: [string, "null"] }
        simulated: { type: boolean }
    InspectionReport:
      type: object
      required: [id, job_id, created_at, status, findings]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        status: { type: string, enum: [awaiting_capture, needs_review, passed, rework_required] }
        findings:
          type: array
          items:
            type: object
            required: [id, board_instance_id, placement_reference, kind, confidence]
            properties:
              id: { type: string, format: uuid }
              board_instance_id: { type: string, format: uuid }
              placement_reference: { type: string }
              kind: { type: string }
              confidence: { type: number, minimum: 0, maximum: 1 }
              measured_offset_mm: { type: [number, "null"], minimum: 0 }
              measured_rotation_deg: { type: [number, "null"] }
              image_artifact: { type: [string, "null"] }
              disposition: { type: [string, "null"] }
    Operation:
      type: object
      required: [id, kind, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        status: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        message: { type: [string, "null"] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
