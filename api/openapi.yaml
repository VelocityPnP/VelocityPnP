openapi: 3.1.0
info:
  title: VelocityPnP API
  version: 0.1.0
  description: >-
    Versioned control, calibration, board, feeder, and job interface. Machine
    operations are asynchronous and return an Operation resource.
servers:
  - url: http://127.0.0.1:4080/api/v1
paths:
  /health:
    get:
      operationId: health
      responses:
        "200": { description: Healthy, content: { application/json: { schema: { type: object } } } }
  /system/devices:
    get:
      operationId: listDevices
      responses:
        "200":
          description: Linux serial and camera devices
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices: { type: array, items: { $ref: "#/components/schemas/DeviceIdentity" } }
  /cameras/{role}/snapshot:
    get:
      operationId: captureCameraSnapshot
      parameters:
        - { name: role, in: path, required: true, schema: { type: string, enum: [top_camera, bottom_camera] } }
      responses:
        "200": { description: Settled 1280x720 grayscale PNG, content: { image/png: { schema: { type: string, format: binary } } } }
  /cameras/{role}/controls:
    get:
      operationId: getCameraControls
      parameters:
        - { name: role, in: path, required: true, schema: { type: string, enum: [top_camera, bottom_camera] } }
      responses:
        "200": { description: Native V4L2 controls and current values, content: { application/json: { schema: { type: object } } } }
    put:
      operationId: setCameraControls
      parameters:
        - { name: role, in: path, required: true, schema: { type: string, enum: [top_camera, bottom_camera] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [controls]
              properties:
                controls:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items:
                    type: object
                    required: [id, value]
                    properties:
                      id: { type: integer, minimum: 0 }
                      value: { oneOf: [{ type: integer }, { type: boolean }] }
      responses:
        "200": { description: Updated controls and read-back values, content: { application/json: { schema: { type: object } } } }
  /cameras/{role}/profile:
    get:
      operationId: getCameraProfile
      parameters:
        - { name: role, in: path, required: true, schema: { $ref: "#/components/schemas/CameraRole" } }
      responses:
        "200":
          description: Persisted profile or the machine-profile default
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraProfile" }
    put:
      operationId: setCameraProfile
      parameters:
        - { name: role, in: path, required: true, schema: { $ref: "#/components/schemas/CameraRole" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraProfile" }
      responses:
        "200":
          description: Validated and persisted camera profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraProfile" }
  /cameras/{role}/reproducibility:
    post:
      operationId: measureCameraReproducibility
      description: >-
        Captures a bounded frame series with the persisted controls and reports
        luma, focus, target-detection, and center-jitter metrics. Requires a
        homed ready machine because the configured ring lights are actuated.
      parameters:
        - { name: role, in: path, required: true, schema: { $ref: "#/components/schemas/CameraRole" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id]
              properties:
                lease_id: { type: string, format: uuid }
                sample_count:
                  type: integer
                  minimum: 1
                  maximum: 60
                  default: 30
      responses:
        "200":
          description: Applied controls and reproducibility report
          content:
            application/json:
              schema:
                type: object
                required: [role, profile, controls, report]
                properties:
                  role: { $ref: "#/components/schemas/CameraRole" }
                  profile: { $ref: "#/components/schemas/CameraProfile" }
                  controls: { type: array, items: { type: object } }
                  report: { $ref: "#/components/schemas/CameraReproducibilityReport" }
  /machine/profile:
    get:
      operationId: getMachineProfile
      responses:
        "200": { description: Active versioned machine profile, content: { application/json: { schema: { type: object } } } }
  /machine/status:
    get:
      operationId: getMachineStatus
      responses:
        "200":
          description: Current machine state
          content:
            application/json:
              schema:
                type: object
                required: [machine]
                properties:
                  machine: { $ref: "#/components/schemas/MachineStatus" }
  /machine/connect:
    post:
      operationId: connectMachine
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /machine/disconnect:
    post:
      operationId: disconnectMachine
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /machine/preflight:
    post:
      operationId: completePreflight
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Confirmation" } } } }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /control/lease:
    post:
      operationId: acquireControlLease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_name]
              properties:
                client_name: { type: string, minLength: 1 }
                duration_seconds: { type: integer, minimum: 30, maximum: 3600, default: 900 }
      responses:
        "200": { description: Exclusive control lease, content: { application/json: { schema: { type: object } } } }
  /control/lease/renew:
    post:
      operationId: renewControlLease
      description: Extends the matching unexpired lease without changing its owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id]
              properties:
                lease_id: { type: string, format: uuid }
                duration_seconds: { type: integer, minimum: 30, maximum: 3600, default: 900 }
      responses:
        "200": { description: Renewed exclusive control lease, content: { application/json: { schema: { type: object } } } }
  /machine/home:
    post:
      operationId: homeMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/LeaseRequest"
                - $ref: "#/components/schemas/Confirmation"
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /machine/jog:
    post:
      operationId: jogMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, target]
              properties:
                lease_id: { type: string, format: uuid }
                target: { $ref: "#/components/schemas/JogTarget" }
                feed_mm_per_min: { type: number, exclusiveMinimum: 0, default: 300 }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /machine/visual-home:
    post:
      operationId: visualHomeMachine
      description: >-
        Moves to the profile seed by default, detects the primary datum, and
        returns a bounded correction plan. Applying the correction also moves,
        captures a verification frame, and resets only the controller XY
        working coordinates after the residual passes. Application remains
        disabled until the profile's camera-to-axis mapping is validated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id]
              properties:
                lease_id: { type: string, format: uuid }
                apply_offset: { type: boolean, default: false }
                move_to_seed:
                  type: boolean
                  default: true
                  description: False observes at the current known pose.
      responses:
        "200":
          description: Datum observation or applied and verified XY reset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisualHomingResult" }
  /machine/actuators/{actuator_id}:
    post:
      operationId: setActuator
      parameters:
        - { name: actuator_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, enabled]
              properties:
                lease_id: { type: string, format: uuid }
                enabled: { type: boolean }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /machine/sensors/{sensor_id}/read:
    post:
      operationId: readMachineSensor
      description: >-
        Reads one profile-defined sensor through the serialized machine actor.
        Values remain raw counts until hardware calibration defines a physical
        conversion.
      parameters:
        - { name: sensor_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeaseRequest" }
      responses:
        "200":
          description: Timestamped sensor reading
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SensorReading" }
  /machine/emergency-stop:
    post:
      operationId: emergencyStop
      description: Always available; does not require a control lease.
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /operations/{id}:
    get:
      operationId: getOperation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Operation, content: { application/json: { schema: { $ref: "#/components/schemas/Operation" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /events:
    get:
      operationId: streamEvents
      responses:
        "200": { description: Server-sent machine events, content: { text/event-stream: { schema: { type: string } } } }
  /events/recent:
    get:
      operationId: recentEvents
      responses:
        "200": { description: Persisted audit events, content: { application/json: { schema: { type: object } } } }
  /calibration/workflow:
    get:
      operationId: calibrationWorkflow
      responses:
        "200": { description: Ordered calibration dependency graph, content: { application/json: { schema: { type: object } } } }
  /calibration/artifacts:
    get:
      operationId: calibrationArtifactWorkflow
      description: >-
        Returns the fine-grained captured, qualification, and derived artifact
        dependency graph with motion and duration estimates.
      responses:
        "200":
          description: Calibration artifact definitions
          content:
            application/json: { schema: { type: object } }
  /calibrations:
    get:
      operationId: listCalibrations
      responses:
        "200": { description: Calibration snapshots, content: { application/json: { schema: { type: object } } } }
    post:
      operationId: createCalibration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [machine_serial]
              properties: { machine_serial: { type: string } }
      responses:
        "201": { description: New snapshot, content: { application/json: { schema: { type: object } } } }
  /calibrations/{id}:
    get:
      operationId: getCalibration
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Calibration snapshot, content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /calibrations/{id}/artifact-plan:
    post:
      operationId: planCalibrationArtifacts
      description: >-
        Classifies each requested artifact and its dependencies as reusable,
        zero-motion recomputation, physical recapture, or blocked. Legacy
        calibration snapshots are migrated to provenance-bearing artifacts.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targets:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Selective calibration plan with motion and duration estimates
          content:
            application/json: { schema: { type: object } }
  /calibrations/{id}/derived-artifacts/recompute:
    post:
      operationId: recomputeDerivedCalibrationArtifacts
      description: >-
        Recalculates requested derived artifacts from current captured sources.
        This endpoint never commands machine motion.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targets:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Recomputed artifact IDs and updated snapshot
          content:
            application/json: { schema: { type: object } }
  /calibrations/{id}/artifact-runs:
    post:
      operationId: startCalibrationArtifactRun
      description: >-
        Runs one live visual alignment, automatically verifies the selected
        tooling, and captures only the requested N1/N2 runout or height
        branches. Lateral motion occurs only while both nozzles are level.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, confirmed_external_safety_checks, targets]
              properties:
                lease_id: { type: string, format: uuid }
                confirmed_external_safety_checks: { type: boolean }
                targets:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum:
                      - nozzle_axis_runout_n1
                      - nozzle_axis_runout_n2
                      - nozzle_height_n1
                      - nozzle_height_n2
      responses:
        "202":
          description: Persisted targeted calibration run and operation
          content:
            application/json: { schema: { type: object } }
  /calibrations/{id}/runs:
    get:
      operationId: listCalibrationRuns
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Persisted machine-executed calibration runs
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/AutomatedCalibrationRun" }
    post:
      operationId: startCalibrationRun
      description: >-
        Starts the profile-scoped initial calibration runner. The machine homes,
        verifies both cameras and installed nozzle tips, applies visual homing,
        measures the top-camera work-plane map from the homing fiducial,
        derives camera-ray transfer from reciprocal camera geometry, and
        measures repeated excursion/return residuals. No measured value is
        accepted from the caller.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, confirmed_external_safety_checks]
              properties:
                lease_id: { type: string, format: uuid }
                confirmed_external_safety_checks: { type: boolean }
                camera_sample_count: { type: integer, minimum: 30, maximum: 60, default: 30 }
                tooling_sample_count: { type: integer, minimum: 5, maximum: 30, default: 5 }
                visual_homing_sample_count:
                  description: >-
                    Three to five cycles are a commissioning check. Production
                    qualification still requires at least 30 stored samples.
                  type: integer
                  minimum: 3
                  maximum: 100
                  default: 5
                excursion_x_mm: { type: number, default: -10 }
                excursion_y_mm: { type: number, default: -10 }
                excursion_feed_mm_per_min: { type: number, exclusiveMinimum: 0, default: 600 }
                visual_homing_p95_limit_mm: { type: number, exclusiveMinimum: 0, default: 0.05 }
      responses:
        "202":
          description: Persisted calibration run and asynchronous operation
          content:
            application/json:
              schema:
                type: object
                required: [run, operation]
                properties:
                  run: { $ref: "#/components/schemas/AutomatedCalibrationRun" }
                  operation: { $ref: "#/components/schemas/Operation" }
  /calibrations/{id}/vacuum-probe:
    post:
      operationId: startVacuumProbe
      description: >-
        Visually registers the fixed homing fiducial, re-identifies and centers
        the installed tip over the bottom camera, visually centers a separate
        sealing target on the datum board, applies a validated height-dependent
        tip-offset correction at the expected contact Z, and samples the raw
        vacuum signal during a bounded descent. The pump starts at the clear search height
        and stops before retract. Contact comes from the vacuum transition, not
        a nominal surface Z. A report is stored in the calibration snapshot,
        but this feasibility probe does not complete Z-plane or
        vacuum-threshold steps.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, nozzle_id, confirmed_external_safety_checks]
              properties:
                lease_id: { type: string, format: uuid }
                nozzle_id: { type: string, enum: [N1, N2] }
                confirmed_external_safety_checks: { type: boolean }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /calibrations/{id}/vacuum-characterization:
    post:
      operationId: startVacuumCharacterization
      description: >-
        Re-registers the cameras and installed tip, visually centers the fixed
        sealing target, and reproduces the prior vacuum contact without moving
        below its stored contact Z. Measures pump-off, pump-on open-nozzle,
        sealed-reference, and pump-off release distributions. Calculates
        per-nozzle and per-tip reference-seal thresholds with hysteresis. This
        does not validate thresholds for holding a production part.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, nozzle_id, confirmed_external_safety_checks]
              properties:
                lease_id: { type: string, format: uuid }
                nozzle_id: { type: string, enum: [N1, N2] }
                confirmed_external_safety_checks: { type: boolean }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /calibrations/{id}/nozzle-height-observation:
    post:
      operationId: recordNozzleHeightObservation
      description: >-
        Records an observed nozzle-to-target XY error at a known nozzle Z.
        An absolute observation solves the common-camera to top-camera
        working-plane transfer term after removing fitted nozzle-axis shift.
        A post-correction residual updates only the selected nozzle's constant
        working-plane term.
        This operation does not move the machine. It is a diagnostic override;
        the supported calibration path derives the transfer automatically from
        reciprocal camera geometry.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nozzle_id, observed_error_x_mm, observed_error_y_mm, measurement_uncertainty_mm]
              properties:
                nozzle_id: { type: string, enum: [N1, N2] }
                nozzle_z_mm:
                  description: Uses the last vacuum-contact Z when omitted.
                  type: number
                observed_error_x_mm:
                  description: Nozzle center minus target center in machine X.
                  type: number
                  minimum: -2
                  maximum: 2
                observed_error_y_mm:
                  description: Nozzle center minus target center in machine Y.
                  type: number
                  minimum: -2
                  maximum: 2
                measurement_uncertainty_mm: { type: number, minimum: 0.01, maximum: 1 }
                post_correction_residual:
                  description: Error remained after applying the stored correction.
                  type: boolean
                  default: false
      responses:
        "200":
          description: Updated calibration snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalibrationSnapshot" }
  /calibration-runs/{id}:
    get:
      operationId: getCalibrationRun
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Current phase, evidence, progress, and report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomatedCalibrationRun" }
        "404": { $ref: "#/components/responses/NotFound" }
  /calibration-runs/{id}/artifacts/{name}:
    get:
      operationId: getCalibrationArtifact
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Persisted calibration diagnostic artifact
          content:
            image/png: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }
  /calibrations/{id}/steps/{step}/invalidate:
    post:
      operationId: invalidateCalibrationStep
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: step, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Snapshot with dependent steps invalidated, content: { application/json: { schema: { type: object } } } }
  /boards:
    get:
      operationId: listBoards
      responses:
        "200": { description: Imported board designs, content: { application/json: { schema: { type: object } } } }
  /boards/import:
    post:
      operationId: importKiCadBoard
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [pcb]
              properties:
                pcb: { type: string, format: binary }
                bom: { type: string, format: binary }
                name: { type: string }
      responses:
        "201": { description: Imported and validated board, content: { application/json: { schema: { type: object } } } }
  /boards/{id}:
    get:
      operationId: getBoard
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Board design, content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /import/openpnp:
    post:
      operationId: importOpenPnp
      description: Extracts untrusted migration seeds; imported calibration never becomes production-ready automatically.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [machine]
              properties:
                machine: { type: string, format: binary }
                parts: { type: string, format: binary }
      responses:
        "200": { description: Staged OpenPnP migration report, content: { application/json: { schema: { type: object } } } }
  /feeders:
    get:
      operationId: listFeeders
      responses:
        "200": { description: Feeders, content: { application/json: { schema: { type: object } } } }
    post:
      operationId: putFeeder
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "201": { description: Stored feeder, content: { application/json: { schema: { type: object } } } }
  /jobs:
    get:
      operationId: listJobs
      responses:
        "200": { description: Jobs, content: { application/json: { schema: { type: object } } } }
    post:
      operationId: putJob
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "201": { description: Stored job, content: { application/json: { schema: { type: object } } } }
  /jobs/{id}/plan:
    get:
      operationId: planJob
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Deterministic plan and preflight report, content: { application/json: { schema: { type: object } } } }
  /jobs/{id}/simulate:
    post:
      operationId: simulateJob
      description: Executes conservative placement cycles only when the daemon uses the simulator driver.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LeaseRequest" } } } }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /inspections:
    get:
      operationId: listInspections
      responses:
        "200": { description: Inspection reports, content: { application/json: { schema: { type: object } } } }
    post:
      operationId: putInspection
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InspectionReport" } } } }
      responses:
        "201": { description: Stored inspection report, content: { application/json: { schema: { $ref: "#/components/schemas/InspectionReport" } } } }
  /inspections/{id}:
    get:
      operationId: getInspection
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Inspection report, content: { application/json: { schema: { $ref: "#/components/schemas/InspectionReport" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /inspections/{id}/findings/{finding_id}/disposition:
    post:
      operationId: dispositionInspectionFinding
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: finding_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disposition]
              properties:
                disposition: { type: string, enum: [accepted, rework, false_positive] }
      responses:
        "200": { description: Updated inspection report, content: { application/json: { schema: { $ref: "#/components/schemas/InspectionReport" } } } }
components:
  responses:
    OperationAccepted:
      description: Operation accepted
      content: { application/json: { schema: { $ref: "#/components/schemas/Operation" } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    CameraRole:
      type: string
      enum: [top_camera, bottom_camera]
    CameraProfile:
      type: object
      required:
        - machine_profile_id
        - role
        - width
        - height
        - frames_per_second
        - settle_frames
        - controls
        - lighting_enabled
        - thresholds
      properties:
        machine_profile_id: { type: string, minLength: 1 }
        role: { $ref: "#/components/schemas/CameraRole" }
        width: { type: integer, minimum: 2 }
        height: { type: integer, minimum: 1 }
        frames_per_second: { type: integer, minimum: 1 }
        settle_frames: { type: integer, minimum: 0, maximum: 120 }
        controls:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            required: [id, value]
            properties:
              id: { type: integer, minimum: 0 }
              value: { oneOf: [{ type: integer }, { type: boolean }] }
        lighting_enabled: { type: boolean }
        thresholds:
          type: object
          required:
            - max_relative_luma_range
            - max_relative_focus_range
            - min_target_detection_rate
            - max_center_jitter_px
          properties:
            max_relative_luma_range: { type: number, minimum: 0 }
            max_relative_focus_range: { type: number, minimum: 0 }
            min_target_detection_rate: { type: number, minimum: 0, maximum: 1 }
            max_center_jitter_px: { type: number, minimum: 0 }
    CameraReproducibilityReport:
      type: object
      required:
        - requested_samples
        - captured_samples
        - capture_failures
        - mean_luma
        - relative_luma_range
        - mean_laplacian_variance
        - relative_focus_range
        - target_detection_rate
        - passed
        - samples
      properties:
        requested_samples: { type: integer, minimum: 1 }
        captured_samples: { type: integer, minimum: 0 }
        capture_failures: { type: integer, minimum: 0 }
        mean_luma: { type: number }
        relative_luma_range: { type: number, minimum: 0 }
        mean_laplacian_variance: { type: number, minimum: 0 }
        relative_focus_range: { type: number, minimum: 0 }
        target_detection_rate: { type: number, minimum: 0, maximum: 1 }
        mean_target_x_px: { type: [number, "null"] }
        mean_target_y_px: { type: [number, "null"] }
        center_jitter_p95_px: { type: [number, "null"], minimum: 0 }
        passed: { type: boolean }
        samples: { type: array, items: { type: object } }
    SensorReading:
      type: object
      required: [sensor_id, raw_value, unit, observed_at]
      properties:
        sensor_id: { type: string }
        raw_value:
          type: integer
          description: Signed raw controller count; not calibrated pressure.
        unit: { type: string, const: raw_counts }
        observed_at: { type: string, format: date-time }
    VisualHomingPlan:
      type: object
      required:
        - target
        - error_x_px
        - error_y_px
        - error_radius_px
        - correction_x_mm
        - correction_y_mm
        - correction_distance_mm
        - within_capture_bound
        - within_correction_bound
        - accepted
      properties:
        target: { type: object }
        error_x_px: { type: number }
        error_y_px: { type: number }
        error_radius_px: { type: number, minimum: 0 }
        correction_x_mm: { type: number }
        correction_y_mm: { type: number }
        correction_distance_mm: { type: number, minimum: 0 }
        within_capture_bound: { type: boolean }
        within_correction_bound: { type: boolean }
        accepted: { type: boolean }
    VisualHomingResult:
      type: object
      required: [applied, seed_pose, initial]
      properties:
        applied: { type: boolean }
        seed_pose: { $ref: "#/components/schemas/Pose" }
        initial: { $ref: "#/components/schemas/VisualHomingPlan" }
        corrected_pose: { $ref: "#/components/schemas/Pose" }
        verification: { $ref: "#/components/schemas/VisualHomingPlan" }
        final_pose: { $ref: "#/components/schemas/Pose" }
    Confirmation:
      type: object
      required: [confirmed]
      properties: { confirmed: { type: boolean } }
    LeaseRequest:
      type: object
      required: [lease_id]
      properties: { lease_id: { type: string, format: uuid } }
    Pose:
      type: object
      required: [x_mm, y_mm, z_mm, rotation_deg]
      properties:
        x_mm: { type: number }
        y_mm: { type: number }
        z_mm: { type: number }
        rotation_deg: { type: number }
    JogTarget:
      type: object
      required: [x_mm, y_mm, z_mm]
      properties:
        x_mm: { type: number }
        y_mm: { type: number }
        z_mm: { type: number }
        rotation_deg:
          type: number
          description: Omit to preserve the controller-reported primary-nozzle angle.
    Residuals:
      type: object
      required: [sample_count, rms_mm, p95_mm, max_mm]
      properties:
        sample_count: { type: integer, minimum: 1 }
        rms_mm: { type: number, minimum: 0 }
        p95_mm: { type: number, minimum: 0 }
        max_mm: { type: number, minimum: 0 }
    MachineStatus:
      type: object
      required: [state, simulated, profile_id, homed]
      properties:
        state:
          type: string
          enum: [disconnected, connected, preflight, unhomed, homing, ready, running, paused, fault, e_stopped]
        simulated: { type: boolean }
        profile_id: { type: string }
        pose: { oneOf: [{ $ref: "#/components/schemas/Pose" }, { type: "null" }] }
        homed: { type: boolean }
        fault: { type: [object, "null"] }
        control_lease: { type: [object, "null"] }
        calibration_revision: { type: [string, "null"], format: uuid }
    DeviceIdentity:
      type: object
      required: [kind, path]
      properties:
        kind: { type: string, enum: [serial_controller, camera] }
        path: { type: string }
        stable_path: { type: [string, "null"] }
        vendor_id: { type: [string, "null"] }
        product_id: { type: [string, "null"] }
        serial: { type: [string, "null"] }
        product: { type: [string, "null"] }
        capture_capable: { type: [boolean, "null"] }
        suggested_role: { type: [string, "null"] }
    CalibrationCheck:
      type: object
      required: [id, title, source, status, message, evidence]
      properties:
        id: { type: string }
        title: { type: string }
        source: { type: string, enum: [controller, vision, operator] }
        status: { type: string, enum: [pending, passed, failed] }
        message: { type: string }
        evidence: {}
    VisualHomingValidationSample:
      type: object
      required:
        - cycle
        - observed_at
        - initial_correction_mm
        - correction_count
        - verification_residual_mm
        - verification_residual_px
        - return_residual_mm
        - return_residual_px
        - return_error_x_px
        - return_error_y_px
      properties:
        cycle: { type: integer, minimum: 1 }
        observed_at: { type: string, format: date-time }
        initial_correction_mm: { type: number, minimum: 0 }
        correction_count: { type: integer, minimum: 0 }
        return_refinement_count:
          type: integer
          minimum: 0
          default: 0
          description: Bounded visual refinements after a direction-dependent return error.
        verification_residual_mm: { type: number, minimum: 0 }
        verification_residual_px: { type: number, minimum: 0 }
        return_residual_mm: { type: number, minimum: 0 }
        return_residual_px: { type: number, minimum: 0 }
        return_error_x_px: { type: number }
        return_error_y_px: { type: number }
    VisualHomingValidationReport:
      type: object
      required:
        - visual_verification
        - independent_return
        - initial_correction_min_mm
        - initial_correction_mean_mm
        - initial_correction_max_mm
        - passed
      properties:
        visual_verification: { $ref: "#/components/schemas/Residuals" }
        independent_return: { $ref: "#/components/schemas/Residuals" }
        initial_correction_min_mm: { type: number, minimum: 0 }
        initial_correction_mean_mm: { type: number, minimum: 0 }
        initial_correction_max_mm: { type: number, minimum: 0 }
        passed: { type: boolean }
    AutomatedCalibrationRun:
      type: object
      required:
        - id
        - calibration_id
        - operation_id
        - profile_id
        - created_at
        - updated_at
        - status
        - phase
        - config
        - checks
        - camera_reports
        - visual_homing_samples
        - simulated
      properties:
        id: { type: string, format: uuid }
        calibration_id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        profile_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        status: { type: string, enum: [pending, running, succeeded, rejected, failed] }
        phase:
          type: string
          enum: [pending, coarse_homing, actuator_checks, top_camera_reproducibility, tooling_verification, bottom_camera_reproducibility, visual_homing_validation, head_geometry_calibration, complete]
        config: { type: object }
        checks:
          type: array
          items: { $ref: "#/components/schemas/CalibrationCheck" }
        camera_reports: { type: object, additionalProperties: true }
        visual_homing_samples:
          type: array
          items: { $ref: "#/components/schemas/VisualHomingValidationSample" }
        visual_homing_report:
          oneOf:
            - { $ref: "#/components/schemas/VisualHomingValidationReport" }
            - { type: "null" }
        head_geometry_report:
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: "null" }
        failure: { type: [string, "null"] }
        simulated: { type: boolean }
    InspectionReport:
      type: object
      required: [id, job_id, created_at, status, findings]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        status: { type: string, enum: [awaiting_capture, needs_review, passed, rework_required] }
        findings:
          type: array
          items:
            type: object
            required: [id, board_instance_id, placement_reference, kind, confidence]
            properties:
              id: { type: string, format: uuid }
              board_instance_id: { type: string, format: uuid }
              placement_reference: { type: string }
              kind: { type: string }
              confidence: { type: number, minimum: 0, maximum: 1 }
              measured_offset_mm: { type: [number, "null"], minimum: 0 }
              measured_rotation_deg: { type: [number, "null"] }
              image_artifact: { type: [string, "null"] }
              disposition: { type: [string, "null"] }
    Operation:
      type: object
      required: [id, kind, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        status: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        message: { type: [string, "null"] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
