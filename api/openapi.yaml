openapi: 3.1.0
info:
  title: VelocityPnP API
  version: 0.1.0
  description: >-
    Versioned control, calibration, board, feeder, and job interface. Machine
    operations are asynchronous and return an Operation resource.
servers:
  - url: http://127.0.0.1:4080/api/v1
paths:
  /health:
    get:
      operationId: health
      responses:
        "200": { description: Healthy, content: { application/json: { schema: { type: object } } } }
  /system/devices:
    get:
      operationId: listDevices
      responses:
        "200":
          description: Linux serial and camera devices
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices: { type: array, items: { $ref: "#/components/schemas/DeviceIdentity" } }
  /cameras/{role}/snapshot:
    get:
      operationId: captureCameraSnapshot
      parameters:
        - { name: role, in: path, required: true, schema: { type: string, enum: [top_camera, bottom_camera] } }
      responses:
        "200": { description: Settled 1280x720 grayscale PNG, content: { image/png: { schema: { type: string, format: binary } } } }
  /cameras/{role}/controls:
    get:
      operationId: getCameraControls
      parameters:
        - { name: role, in: path, required: true, schema: { type: string, enum: [top_camera, bottom_camera] } }
      responses:
        "200": { description: Native V4L2 controls and current values, content: { application/json: { schema: { type: object } } } }
    put:
      operationId: setCameraControls
      parameters:
        - { name: role, in: path, required: true, schema: { type: string, enum: [top_camera, bottom_camera] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [controls]
              properties:
                controls:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items:
                    type: object
                    required: [id, value]
                    properties:
                      id: { type: integer, minimum: 0 }
                      value: { oneOf: [{ type: integer }, { type: boolean }] }
      responses:
        "200": { description: Updated controls and read-back values, content: { application/json: { schema: { type: object } } } }
  /cameras/{role}/profile:
    get:
      operationId: getCameraProfile
      parameters:
        - { name: role, in: path, required: true, schema: { $ref: "#/components/schemas/CameraRole" } }
      responses:
        "200":
          description: Persisted profile or the machine-profile default
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraProfile" }
    put:
      operationId: setCameraProfile
      parameters:
        - { name: role, in: path, required: true, schema: { $ref: "#/components/schemas/CameraRole" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CameraProfile" }
      responses:
        "200":
          description: Validated and persisted camera profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraProfile" }
  /cameras/{role}/reproducibility:
    post:
      operationId: measureCameraReproducibility
      description: >-
        Captures a bounded frame series with the persisted controls and reports
        luma, focus, target-detection, and center-jitter metrics. Requires a
        homed ready machine because the configured ring lights are actuated.
      parameters:
        - { name: role, in: path, required: true, schema: { $ref: "#/components/schemas/CameraRole" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id]
              properties:
                lease_id: { type: string, format: uuid }
                sample_count:
                  type: integer
                  minimum: 1
                  maximum: 60
                  default: 30
      responses:
        "200":
          description: Applied controls and reproducibility report
          content:
            application/json:
              schema:
                type: object
                required: [role, profile, controls, report]
                properties:
                  role: { $ref: "#/components/schemas/CameraRole" }
                  profile: { $ref: "#/components/schemas/CameraProfile" }
                  controls: { type: array, items: { type: object } }
                  report: { $ref: "#/components/schemas/CameraReproducibilityReport" }
  /workspace-scans:
    get:
      operationId: listWorkspaceScans
      responses:
        "200":
          description: Stored workspace scan reports
          content:
            application/json:
              schema:
                type: object
                required: [scans]
                properties:
                  scans:
                    type: array
                    items: { $ref: "#/components/schemas/WorkspaceScanReport" }
    post:
      operationId: startWorkspaceScan
      description: >-
        Starts a calibrated serpentine scan. External safety confirmation
        covers level nozzles, a clear travel envelope, and reachable power
        isolation. The machine returns to the visual datum with lights off.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartWorkspaceScanRequest" }
      responses:
        "202":
          description: Accepted workspace scan and its preflight estimate
          content:
            application/json:
              schema:
                type: object
                required: [scan, operation, estimate]
                properties:
                  scan: { $ref: "#/components/schemas/WorkspaceScanReport" }
                  operation: { $ref: "#/components/schemas/Operation" }
                  estimate: { $ref: "#/components/schemas/WorkspaceScanEstimate" }
  /workspace-scans/estimate:
    post:
      operationId: estimateWorkspaceScan
      description: Plans a scan and checks size and artifact quotas without motion.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceScanSpecification" }
      responses:
        "200":
          description: Workspace scan preflight estimate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceScanEstimate" }
  /workspace-scans/{id}:
    get:
      operationId: getWorkspaceScan
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Workspace scan report and progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceScanReport" }
  /workspace-scans/{id}/refinement-targets:
    get:
      operationId: getWorkspaceRefinementTargets
      description: >-
        Reclassifies the retained reconnaissance diagnostics with the current
        policy and returns bounded machine-coordinate refinement regions.
        This operation causes no machine motion and does not change the parent
        scan record.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Current selective-refinement targets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceRefinementTargets" }
  /workspace-scans/{id}/refinements:
    post:
      operationId: startWorkspaceRefinementBatch
      description: >-
        Ranks current refinement targets, skips successful targets, and runs
        the selected patches sequentially. A target failure stops the queue.
        Pending child scans remain visible with a failed status and an
        explanation. External safety confirmation applies to every selected
        region.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartWorkspaceRefinementBatchRequest" }
      responses:
        "202":
          description: Accepted prioritized refinement batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartWorkspaceRefinementBatchResponse" }
  /workspace-scans/{id}/refinement-composite:
    post:
      operationId: buildWorkspaceRefinementComposite
      description: >-
        Resamples every current successful height-corrected refinement into
        the reconnaissance raster. This operation causes no machine motion.
        It persists a plain composite, a quality report, and an outlined
        quality preview. Scan success does not bypass the quality gate.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Georeferenced refinement composite and quality result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceRefinementCompositeSummary" }
  /workspace-scans/{id}/board-discovery:
    post:
      operationId: buildWorkspaceBoardDiscovery
      deprecated: true
      description: >-
        Compatibility alias for object-proposals.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Plate-aligned semantic object proposals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceBoardDiscoveryReport" }
  /workspace-scans/{id}/object-proposals:
    post:
      operationId: buildWorkspaceObjectProposals
      description: >-
        Finds connected raised-surface regions, aligns proposal edges with
        calibrated plate axes, applies known-fixture evidence, and retains a
        normalized image crop for each object. Weak semantic evidence returns
        unknown. This operation causes no machine motion.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Plate-aligned semantic object proposals and evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceBoardDiscoveryReport" }
  /workspace-scans/{id}/strip-feeder-vision:
    post:
      operationId: buildStripFeederVision
      description: >-
        Detects carrier-tape sprocket lattices, plate-aligned tape axes,
        standard tape width, and component-pocket pitch in one retained feeder
        candidate. A non-fixture unknown staging candidate can enter the
        specialist when its classification contains feeder evidence. The
        result is draft evidence. It does not cause motion or create an active
        feeder.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [candidate_index]
              properties:
                candidate_index: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Retained no-motion strip-feeder vision evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StripFeederVisionReport" }
  /workspace-scans/{id}/strip-feeder-inventory:
    post:
      operationId: buildStripFeederInventory
      description: >-
        Combines retained strip-feeder vision reports from compatible focused
        scans. Every report must come from a height-corrected mosaic. If the
        target scan has a semantic workspace preview, that full preview remains
        the background, including detected elements and PCB design marks.
        Corrected feeder pixels replace only the strip interiors. The result
        merges overlapping lanes and annotates strip outlines, measured
        component outlines, and present, absent, or uncertain feed positions.
        Lanes that reach a scan edge make counts lower bounds and produce a
        recommended rescan region. This operation causes no machine motion.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidence_sources]
              properties:
                evidence_sources:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/StripFeederInventoryEvidenceSource"
      responses:
        "200":
          description: Combined feeder population inventory and overlay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StripFeederInventoryReport" }
  /workspace-scans/{id}/inventory-baseline:
    post:
      operationId: activateWorkspaceInventoryBaseline
      description: >-
        Marks this successful semantic workspace scan as the persistent
        inventory baseline. This operation causes no machine motion.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Active workspace inventory baseline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceInventoryBaseline" }
  /workspace-scans/{id}/change-set:
    post:
      operationId: buildWorkspaceChangeSet
      description: >-
        Compares semantic objects with a compatible persistent baseline. A raw
        reconnaissance scan uses baseline regions, plate-projected rasters,
        and seam-health regions before a new height map exists. Objects
        outside a partial observation are reused. Changed non-machine objects
        produce bounded refinement regions. This operation causes no motion.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuildWorkspaceChangeSetRequest" }
      responses:
        "200":
          description: Workspace object changes and refinement regions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceChangeSetReport" }
  /workspace-inventory/baseline:
    get:
      operationId: getWorkspaceInventoryBaseline
      responses:
        "200":
          description: Most recently activated workspace inventory baseline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceInventoryBaseline" }
  /workspace-scans/{id}/artifacts/{name}:
    get:
      operationId: getWorkspaceScanArtifact
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: PNG image or JSON scan artifact
          content:
            image/png: { schema: { type: string, format: binary } }
            application/json: { schema: { type: object } }
  /machine/profile:
    get:
      operationId: getMachineProfile
      responses:
        "200": { description: Active versioned machine profile, content: { application/json: { schema: { type: object } } } }
  /machine/status:
    get:
      operationId: getMachineStatus
      responses:
        "200":
          description: Current machine state
          content:
            application/json:
              schema:
                type: object
                required: [machine]
                properties:
                  machine: { $ref: "#/components/schemas/MachineStatus" }
  /machine/connect:
    post:
      operationId: connectMachine
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /machine/disconnect:
    post:
      operationId: disconnectMachine
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /machine/preflight:
    post:
      operationId: completePreflight
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Confirmation" } } } }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /control/lease:
    post:
      operationId: acquireControlLease
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_name]
              properties:
                client_name: { type: string, minLength: 1 }
                duration_seconds: { type: integer, minimum: 30, maximum: 3600, default: 900 }
      responses:
        "200": { description: Exclusive control lease, content: { application/json: { schema: { type: object } } } }
  /control/lease/renew:
    post:
      operationId: renewControlLease
      description: Extends the matching unexpired lease without changing its owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id]
              properties:
                lease_id: { type: string, format: uuid }
                duration_seconds: { type: integer, minimum: 30, maximum: 3600, default: 900 }
      responses:
        "200": { description: Renewed exclusive control lease, content: { application/json: { schema: { type: object } } } }
  /machine/home:
    post:
      operationId: homeMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/LeaseRequest"
                - $ref: "#/components/schemas/Confirmation"
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /machine/jog:
    post:
      operationId: jogMachine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, target]
              properties:
                lease_id: { type: string, format: uuid }
                target: { $ref: "#/components/schemas/JogTarget" }
                feed_mm_per_min: { type: number, exclusiveMinimum: 0, default: 300 }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /machine/visual-home:
    post:
      operationId: visualHomeMachine
      description: >-
        Moves to the profile seed by default, detects the primary datum, and
        returns a bounded correction plan. Applying the correction also moves,
        captures a verification frame, and resets only the controller XY
        working coordinates after the residual passes. Application remains
        disabled until the profile's camera-to-axis mapping is validated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id]
              properties:
                lease_id: { type: string, format: uuid }
                apply_offset: { type: boolean, default: false }
                move_to_seed:
                  type: boolean
                  default: true
                  description: False observes at the current known pose.
      responses:
        "200":
          description: Datum observation or applied and verified XY reset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisualHomingResult" }
  /machine/actuators/{actuator_id}:
    post:
      operationId: setActuator
      parameters:
        - { name: actuator_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, enabled]
              properties:
                lease_id: { type: string, format: uuid }
                enabled: { type: boolean }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /machine/sensors/{sensor_id}/read:
    post:
      operationId: readMachineSensor
      description: >-
        Reads one profile-defined sensor through the serialized machine actor.
        Values remain raw counts until hardware calibration defines a physical
        conversion.
      parameters:
        - { name: sensor_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeaseRequest" }
      responses:
        "200":
          description: Timestamped sensor reading
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SensorReading" }
  /machine/emergency-stop:
    post:
      operationId: emergencyStop
      description: Always available; does not require a control lease.
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /operations/{id}:
    get:
      operationId: getOperation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Operation, content: { application/json: { schema: { $ref: "#/components/schemas/Operation" } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /events:
    get:
      operationId: streamEvents
      responses:
        "200": { description: Server-sent machine events, content: { text/event-stream: { schema: { type: string } } } }
  /events/recent:
    get:
      operationId: recentEvents
      responses:
        "200": { description: Persisted audit events, content: { application/json: { schema: { type: object } } } }
  /calibration/workflow:
    get:
      operationId: calibrationWorkflow
      responses:
        "200": { description: Ordered calibration dependency graph, content: { application/json: { schema: { type: object } } } }
  /calibration/artifacts:
    get:
      operationId: calibrationArtifactWorkflow
      description: >-
        Returns the fine-grained captured, qualification, and derived artifact
        dependency graph with motion and duration estimates.
      responses:
        "200":
          description: Calibration artifact definitions
          content:
            application/json: { schema: { type: object } }
  /calibrations:
    get:
      operationId: listCalibrations
      responses:
        "200": { description: Calibration snapshots, content: { application/json: { schema: { type: object } } } }
    post:
      operationId: createCalibration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [machine_serial]
              properties: { machine_serial: { type: string } }
      responses:
        "201": { description: New snapshot, content: { application/json: { schema: { type: object } } } }
  /calibrations/{id}:
    get:
      operationId: getCalibration
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Calibration snapshot, content: { application/json: { schema: { type: object } } } }
        "404": { $ref: "#/components/responses/NotFound" }
  /calibrations/{id}/artifact-plan:
    post:
      operationId: planCalibrationArtifacts
      description: >-
        Classifies each requested artifact and its dependencies as reusable,
        zero-motion recomputation, physical recapture, or blocked. Legacy
        calibration snapshots are migrated to provenance-bearing artifacts.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targets:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Selective calibration plan with motion and duration estimates
          content:
            application/json: { schema: { type: object } }
  /calibrations/{id}/derived-artifacts/recompute:
    post:
      operationId: recomputeDerivedCalibrationArtifacts
      description: >-
        Recalculates requested derived artifacts from current captured sources.
        This endpoint never commands machine motion.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targets:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Recomputed artifact IDs and updated snapshot
          content:
            application/json: { schema: { type: object } }
  /calibrations/{id}/artifact-runs:
    post:
      operationId: startCalibrationArtifactRun
      description: >-
        Runs one live visual alignment, automatically verifies the selected
        tooling, and captures only the requested N1/N2 runout or height
        branches. Lateral motion occurs only while both nozzles are level.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, confirmed_external_safety_checks, targets]
              properties:
                lease_id: { type: string, format: uuid }
                confirmed_external_safety_checks: { type: boolean }
                targets:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum:
                      - nozzle_axis_runout_n1
                      - nozzle_axis_runout_n2
                      - nozzle_height_n1
                      - nozzle_height_n2
      responses:
        "202":
          description: Persisted targeted calibration run and operation
          content:
            application/json: { schema: { type: object } }
  /calibrations/{id}/runs:
    get:
      operationId: listCalibrationRuns
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Persisted machine-executed calibration runs
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/AutomatedCalibrationRun" }
    post:
      operationId: startCalibrationRun
      description: >-
        Starts the profile-scoped initial calibration runner. The machine homes,
        verifies both cameras and installed nozzle tips, applies visual homing,
        measures the top-camera work-plane map from the homing fiducial,
        derives camera-ray transfer from reciprocal camera geometry, and
        measures repeated excursion/return residuals. No measured value is
        accepted from the caller.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, confirmed_external_safety_checks]
              properties:
                lease_id: { type: string, format: uuid }
                confirmed_external_safety_checks: { type: boolean }
                camera_sample_count: { type: integer, minimum: 30, maximum: 60, default: 30 }
                tooling_sample_count: { type: integer, minimum: 5, maximum: 30, default: 5 }
                visual_homing_sample_count:
                  description: >-
                    Three to five cycles are a commissioning check. Production
                    qualification still requires at least 30 stored samples.
                  type: integer
                  minimum: 3
                  maximum: 100
                  default: 5
                excursion_x_mm: { type: number, default: -10 }
                excursion_y_mm: { type: number, default: -10 }
                excursion_feed_mm_per_min: { type: number, exclusiveMinimum: 0, default: 600 }
                visual_homing_p95_limit_mm: { type: number, exclusiveMinimum: 0, default: 0.05 }
      responses:
        "202":
          description: Persisted calibration run and asynchronous operation
          content:
            application/json:
              schema:
                type: object
                required: [run, operation]
                properties:
                  run: { $ref: "#/components/schemas/AutomatedCalibrationRun" }
                  operation: { $ref: "#/components/schemas/Operation" }
  /calibrations/{id}/vacuum-probe:
    post:
      operationId: startVacuumProbe
      description: >-
        Visually registers the fixed homing fiducial, re-identifies and centers
        the installed tip over the bottom camera, visually centers a separate
        sealing target on the datum board, applies a validated height-dependent
        tip-offset correction at the expected contact Z, and samples the raw
        vacuum signal during a bounded descent. The pump starts at the clear search height
        and stops before retract. Contact comes from the vacuum transition, not
        a nominal surface Z. A report is stored in the calibration snapshot,
        but this feasibility probe does not complete Z-plane or
        vacuum-threshold steps.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, nozzle_id, confirmed_external_safety_checks]
              properties:
                lease_id: { type: string, format: uuid }
                nozzle_id: { type: string, enum: [N1, N2] }
                confirmed_external_safety_checks: { type: boolean }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /calibrations/{id}/vacuum-characterization:
    post:
      operationId: startVacuumCharacterization
      description: >-
        Re-registers the cameras and installed tip, visually centers the fixed
        sealing target, and reproduces the prior vacuum contact without moving
        below its stored contact Z. Measures pump-off, pump-on open-nozzle,
        sealed-reference, and pump-off release distributions. Calculates
        per-nozzle and per-tip reference-seal thresholds with hysteresis. This
        does not validate thresholds for holding a production part.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, nozzle_id, confirmed_external_safety_checks]
              properties:
                lease_id: { type: string, format: uuid }
                nozzle_id: { type: string, enum: [N1, N2] }
                confirmed_external_safety_checks: { type: boolean }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /calibrations/{id}/fine-home:
    post:
      operationId: startFineHome
      description: >-
        Establishes the session precision XYZ reference. It visually refines
        X/Y, identifies and centers the installed nozzle, centers the separate
        datum-board sealing target, and reproduces vacuum contact within 0.3
        mm of the stored safe contact. A Z-only coordinate reset is limited to
        0.5 mm and binds machine status to this calibration UUID.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, nozzle_id, confirmed_external_safety_checks]
              properties:
                lease_id: { type: string, format: uuid }
                nozzle_id: { type: string, enum: [N1, N2], default: N2 }
                confirmed_external_safety_checks: { type: boolean }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /calibrations/{id}/xy-direction-response:
    post:
      operationId: startLocalXyDirectionResponse
      description: >-
        Visually aligns to the fixed homing fiducial, then approaches the same
        commanded pose from positive and negative X and Y at several bounded
        distances and speeds. Sampling stops adaptively when an effect is
        resolved or cannot be distinguished from measured repeatability.
        Direction-specific corrections are retained only when an independent
        holdout pair reduces the observed direction gap. This is a local
        measurement and does not claim full-bed scale, skew, or distortion.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, confirmed_external_safety_checks]
              properties:
                lease_id: { type: string, format: uuid }
                confirmed_external_safety_checks: { type: boolean }
      responses:
        "202": { $ref: "#/components/responses/OperationAccepted" }
  /calibrations/{id}/installed-geometry-runs:
    post:
      operationId: startInstalledGeometryRun
      description: >-
        Sweeps the installed datum through the top-camera image, sweeps the
        identified N1 tip through the bottom-camera image, and scans candidate
        holes from the installed staging and build plates. The profile identifies
        the datum-PCB plate as the bottom staging plate and the adjacent north
        plate as the top build plate. The daemon registers the staging plate first,
        seeds build registration from it, and confirms each plate from two
        consistent visible holes. Occupied, clipped, or ambiguous holes are
        recorded and skipped. Compatible camera sweeps and plate samples from an
        interrupted run are requalified per plate and reused. Distortion-polynomial
        and affine plate corrections are selected only when they improve
        independent holdout observations. Both configured plates must qualify.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, confirmed_external_safety_checks]
              properties:
                lease_id: { type: string, format: uuid }
                confirmed_external_safety_checks: { type: boolean }
      responses:
        "202":
          description: Persisted installed-geometry run and operation
          content:
            application/json:
              schema:
                type: object
                required: [run, operation]
                properties:
                  run: { $ref: "#/components/schemas/AutomatedCalibrationRun" }
                  operation: { $ref: "#/components/schemas/Operation" }
  /calibrations/{id}/nozzle-height-observation:
    post:
      operationId: recordNozzleHeightObservation
      description: >-
        Records an observed nozzle-to-target XY error at a known nozzle Z.
        An absolute observation solves the common-camera to top-camera
        working-plane transfer term after removing fitted nozzle-axis shift.
        A post-correction residual updates only the selected nozzle's constant
        working-plane term.
        This operation does not move the machine. It is a diagnostic override;
        the supported calibration path derives the transfer automatically from
        reciprocal camera geometry.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nozzle_id, observed_error_x_mm, observed_error_y_mm, measurement_uncertainty_mm]
              properties:
                nozzle_id: { type: string, enum: [N1, N2] }
                nozzle_z_mm:
                  description: Uses the last vacuum-contact Z when omitted.
                  type: number
                observed_error_x_mm:
                  description: Nozzle center minus target center in machine X.
                  type: number
                  minimum: -2
                  maximum: 2
                observed_error_y_mm:
                  description: Nozzle center minus target center in machine Y.
                  type: number
                  minimum: -2
                  maximum: 2
                measurement_uncertainty_mm: { type: number, minimum: 0.01, maximum: 1 }
                post_correction_residual:
                  description: Error remained after applying the stored correction.
                  type: boolean
                  default: false
      responses:
        "200":
          description: Updated calibration snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalibrationSnapshot" }
  /calibration-runs/{id}:
    get:
      operationId: getCalibrationRun
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Current phase, evidence, progress, and report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutomatedCalibrationRun" }
        "404": { $ref: "#/components/responses/NotFound" }
  /calibration-runs/{id}/artifacts/{name}:
