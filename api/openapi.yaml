          content:
            application/json:
              schema: { $ref: "#/components/schemas/Part" }
        "404": { $ref: "#/components/responses/NotFound" }
  /strip-feeder-registrations:
    get:
      operationId: listStripFeederRegistrations
      responses:
        "200":
          description: Persistent feeder setup drafts
          content:
            application/json:
              schema:
                type: object
                required: [registrations]
                properties:
                  registrations:
                    type: array
                    items: { $ref: "#/components/schemas/StripFeederRegistration" }
    post:
      operationId: createStripFeederRegistration
      description: >-
        Stores one measured lane as a feeder setup draft. This operation does
        not cause motion and cannot create an active production feeder.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scan_id, candidate_index, proposal_index]
              properties:
                scan_id: { type: string, format: uuid }
                candidate_index: { type: integer, minimum: 0 }
                proposal_index: { type: integer, minimum: 0 }
                name: { type: [string, "null"] }
                part_key: { type: [string, "null"] }
                part_rotation_deg: { type: [number, "null"] }
      responses:
        "201":
          description: Stored feeder setup draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StripFeederRegistration" }
  /strip-feeder-registrations/{id}:
    get:
      operationId: getStripFeederRegistration
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Persistent feeder setup draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StripFeederRegistration" }
        "404": { $ref: "#/components/responses/NotFound" }
  /strip-feeder-registrations/{id}/live-holdouts:
    post:
      operationId: startStripFeederLiveHoldout
      description: >-
        Visual-homes, makes a short safe-Z camera sweep around one predicted
        pocket and both possible sprocket rows, and measures fresh sprocket
        geometry, local tape correction, and pocket occupancy. It does not
        lower a nozzle or index tape.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lease_id, confirmed_external_safety_checks]
              properties:
                lease_id: { type: string, format: uuid }
                pocket_index: { type: [integer, "null"], minimum: 0 }
                sample_count: { type: integer, minimum: 3, maximum: 5, default: 3 }
                confirmed_external_safety_checks: { type: boolean }
      responses:
        "202":
          description: Live pocket holdout accepted
          content:
            application/json:
              schema:
                type: object
                required: [holdout, operation]
                properties:
                  holdout: { $ref: "#/components/schemas/StripFeederLiveHoldoutRun" }
                  operation: { $ref: "#/components/schemas/Operation" }
  /strip-feeder-live-holdouts/{id}:
    get:
      operationId: getStripFeederLiveHoldout
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Persistent live pocket holdout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StripFeederLiveHoldoutRun" }
        "404": { $ref: "#/components/responses/NotFound" }
  /strip-feeder-live-holdouts/{id}/artifacts/{name}:
    get:
      operationId: getStripFeederLiveHoldoutArtifact
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Annotated live holdout evidence }
        "404": { $ref: "#/components/responses/NotFound" }
  /strip-feeder-registrations/{id}/pickup-qualifications:
    post:
      operationId: startStripFeederPickupQualification
      description: >-
        Uses bounded vacuum Z detection to pick one component from a passed
        live holdout, transfers it to the bottom camera, applies bounded
        closed-loop centering and angle corrections, and returns it to the
        same pocket. A supplied fallback point is used only if the pocket
        return target is invalid.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lease_id
                - nozzle_id
                - confirmed_external_safety_checks
              properties:
                lease_id: { type: string, format: uuid }
                nozzle_id: { type: string }
                pocket_index: { type: [integer, "null"], minimum: 0 }
                fallback_drop_surface_machine_mm:
                  oneOf:
                    - { $ref: "#/components/schemas/Point2d" }
                    - type: "null"
                confirmed_external_safety_checks: { type: boolean }
      responses:
        "202":
          description: Pickup qualification accepted
          content:
            application/json:
              schema:
                type: object
                required: [qualification, operation]
                properties:
                  qualification:
                    { $ref: "#/components/schemas/StripFeederPickupQualificationRun" }
                  operation: { $ref: "#/components/schemas/Operation" }
  /strip-feeder-pickup-qualifications/{id}:
    get:
      operationId: getStripFeederPickupQualification
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Persistent pickup qualification
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/StripFeederPickupQualificationRun" }
        "404": { $ref: "#/components/responses/NotFound" }
  /strip-feeder-pickup-qualifications/{id}/reanalyze-return:
    post:
      operationId: reanalyzeStripFeederPickupReturn
      description: >-
        Rechecks retained before-pickup and after-release images with the
        current deterministic return gate. This causes no machine motion. A
        rejected result marks the source pocket as needing review.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated persistent pickup qualification
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/StripFeederPickupQualificationRun" }
        "404": { $ref: "#/components/responses/NotFound" }
  /strip-feeder-pickup-qualifications/{id}/artifacts/{name}:
    get:
      operationId: getStripFeederPickupQualificationArtifact
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Pickup camera evidence }
        "404": { $ref: "#/components/responses/NotFound" }
